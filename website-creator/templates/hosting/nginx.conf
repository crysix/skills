# nginx for a static site on an own server. Replace DOMAIN.TLD (without www).
# Get the certificate first with only the port-80 block active (see hosting/own-server.md),
# then add the two 443 blocks and run: sudo nginx -t && sudo systemctl reload nginx

server {                       # HTTP -> HTTPS, the ACME challenge path stays reachable
    listen 80;
    listen [::]:80;
    server_name DOMAIN.TLD www.DOMAIN.TLD;
    location ^~ /.well-known/acme-challenge/ { root /var/www/DOMAIN.TLD; }
    location / { return 301 https://DOMAIN.TLD$request_uri; }
}

server {                       # https://www -> https://DOMAIN.TLD
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                  # nginx 1.25.1 or later; on 1.24 (Ubuntu 24.04) use "listen 443 ssl http2;" instead
    server_name www.DOMAIN.TLD;
    ssl_certificate     /etc/letsencrypt/live/DOMAIN.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN.TLD/privkey.pem;
    return 301 https://DOMAIN.TLD$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN.TLD;
    ssl_certificate     /etc/letsencrypt/live/DOMAIN.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN.TLD/privkey.pem;

    root  /var/www/DOMAIN.TLD;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/xml image/svg+xml;

    # Inherited by the locations below only because none of them uses add_header.
    # An add_header in a location would drop these three there.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Hidden files except /.well-known/; must come before the asset rules
    location ~ /\.(?!well-known/) { deny all; }

    # Working files, in case they get uploaded after all
    location ~* \.(?:md|py|zip)$ { deny all; }

    location ~* \.(?:woff2?|ttf|otf)$                  { expires 1y; }
    location ~* \.(?:css|js|mjs)$                      { expires 1y; }   # versioned by deploy/build.py
    location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico)$ { expires 1M; }

    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;            # Cache-Control: no-cache for HTML
    }
}
